<header class="topbar">
  <div>
    <h1>提前还款方案对比工作台</h1>
    <p>
      对同一笔提前还款，分别生成「缩短期限」与「降低月供」两种还款计划，逐期展示本金、利息与剩余余额。
      支持等额本息与等额本金；合同利率按生效日分段维护，跨调息日的期按实际占用天数计息。
      全部使用模拟合同，不连接真实放贷接口。
    </p>
  </div>
</header>

<main class="container">
  <app-compare-form [loading]="loading" (submitted)="onSubmit($event)" />

  <div class="error-banner" *ngIf="error">{{ error }}</div>

  <ng-container *ngIf="comparison">
    <div class="record-note" *ngIf="recordId != null">
      <span>
        当前展示：计算记录 #{{ recordId }}
        · 计划起始日 {{ scheduleStartDate }}
        · 利率{{ rateVersionNo != null ? '版本 v' + rateVersionNo : '快照（手工录入）' }}（计算时固化，不随后续编辑漂移）
      </span>
      <button type="button" class="derive-btn" (click)="onDerive()" [disabled]="deriving">
        {{ deriving ? '派生中…' : '按当前利率表派生新计算' }}
      </button>
    </div>
    <app-plan-result [result]="comparison" [method]="method" />
  </ng-container>

  <app-history [refreshToken]="historyRefresh" (viewRecord)="onViewRecord($event)" />
</main>
